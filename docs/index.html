<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DistroMarket 404 — sruPL</title>

  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a33;
      --panel2: #172447;
      --text: #e8f0ff;
      --muted: #9fb0d0;
      --accent: #8eff9b;
      --yellow: #ffe66d;
      --pink: #ff6bd6;
      --danger: #ff6b6b;
      --line: #28365f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 0%, #1a2a5c 0, #0b1020 42%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 24px;
      background: rgba(11, 16, 32, .86);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 36px;
      filter: drop-shadow(0 0 12px var(--accent));
    }

    .brand strong {
      display: block;
      font-size: 18px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    nav a,
    .btn {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      padding: 10px 13px;
      border-radius: 14px;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
      display: inline-block;
      font: inherit;
    }

    nav a:hover,
    .btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #04110a;
      border: 0;
      font-weight: 900;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px 20px 80px;
    }

    section {
      margin-bottom: 28px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 24px;
      align-items: center;
    }

    .card {
      background: linear-gradient(180deg, rgba(23,36,71,.96), rgba(18,26,51,.98));
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 24px;
      box-shadow: 0 22px 60px rgba(0,0,0,.28);
    }

    h1 {
      font-size: clamp(38px, 7vw, 78px);
      line-height: .95;
      margin: 0 0 18px;
    }

    h2 {
      font-size: 30px;
      margin: 0 0 14px;
    }

    h3 {
      margin: 0 0 8px;
    }

    .gradient {
      background: linear-gradient(90deg, var(--accent), var(--yellow), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .muted {
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(142,255,155,.12);
      border: 1px solid rgba(142,255,155,.3);
      color: var(--accent);
